# ============================================================================
# MIGRATION LEDGER — single source of truth for port status.
#
# Rules:
#  - One entry per work unit. Ids: <area>-NN. Never reuse an id.
#  - layer: core | shell | data | infra
#  - status: not-started | in-progress | translated | verified | blocked
#  - 'verified' (core) requires: dotnet build green + oracle agreement for the
#    unit's scenarios + session report written. (infra/data: build green + checks.)
#  - contract: required for core units BEFORE implementation begins.
#  - session: id of the session report that last touched the unit.
#  - Analysis/regeneration facts live in analysis/; statuses live ONLY here.
# ============================================================================

meta:
  orig_commit: 781e379f79f1e7512d168849cba21ed111502644
  orig_version: "1.6.1.6"
  target: kittens_land (Elmish.Land 2.0, Fable 5.17.0, .NET SDK 11.0.100-rc.1)
  coverage_target: all game-role + ui-jsx + html files in analysis/files.json
  excluded_from_port: lib/ (babel runtime), test/ (orig's own tests), tools/ (mock server) — see decisions D004

units:
  # ---------------------------------------------------------------- bootstrap
  - id: bootstrap-01
    title: multistep_port structure, plan, and session protocol
    layer: infra
    target: PLAN.md, README.md, ledger/, reports/, oracle/, analysis/
    status: verified
    session: 2026-09-27-01

  - id: bootstrap-02
    title: Mechanical orig scanner (files.json, nondeterminism.json)
    layer: infra
    source: { file: "<orig root>", symbols: [], lines: "all" }
    target: tools/scan.js, analysis/files.json, analysis/nondeterminism.json
    status: verified
    verification:
      checks: "82 files / 51,623 lines scanned; counts sane vs manual wc; sha256 recorded"
    session: 2026-09-27-01

  - id: bootstrap-03
    title: kittens_land Elmish.Land 2.0 scaffold, both builds green
    layer: infra
    target: kittens_land/
    status: verified
    verification:
      build: "dotnet build 0w/0e; elmish-land build produced dist/"
      notes: "SDK pin fixed to 11.0.100-rc.1 (global.json), fable 5.17.0 tool manifest added (decisions D008)"
    session: 2026-09-27-01

  # ------------------------------------------------------------------- oracle
  - id: oracle-01
    title: Orig headless runner (node harness over jest bootloader stubs)
    layer: infra
    contract: >
      Load orig game in Node using the test/setup.js approach (portable declare,
      mocked dojo, React/jQuery from lib/). Inject: seeded Math.random, fake Date
      (advances 1000ms per tick), in-memory localStorage, no Web Worker (drive
      game.tick() synchronously), KGNet stubbed. CLI: run scenario file -> write
      snapshot JSON at checkpoint ticks. Orig source untouched.
    depends_on: [oracle-02]
    status: verified
    session: 2026-09-28-02
    verification:
      checks: "orig loads headless via jest-style stubs (jsdom window mirroring, $I mock, LCstorage); fresh 100-tick run: 1523 rng draws; all actions through player-equivalent controller paths; orig untouched"

  - id: oracle-02
    title: Scenario format + parser + first scenarios
    layer: infra
    contract: >
      Scenario = comment header (name, seed, checkpoints) + lines "<tick> <action>".
      Action vocabulary (mapped to orig UI controllers like test/game.test.js does):
      gather | buy <building>[.stage] | craft <resource> [count] | assign <job> <count>
      | unassign <job> <count> | research <tech> | upgrade <name> | hunt | praise |
      save | load | assert <json-pointer> <value>. First scenarios:
      fresh-100-ticks.cat, gather-hut-field.cat.
    status: verified
    session: 2026-09-28-02
    verification:
      checks: "oracle/runner/scenario.js + 3 scenarios; semantics pinned: tick-0 moves run before tick-0 snapshot, moves at T run before tick T; failed actions logged with reasons in actionLog (buy/craft/assign/research/upgrade/policy)"
    notes: "implemented: gather/buy/craft/assign/research/upgrade/policy/hunt/praise/observe/save/load"

  - id: oracle-03
    title: Golden fixture capture + determinism self-check
    layer: infra
    contract: >
      Run each scenario twice on orig with same seed; snapshots must be identical
      (determinism self-check). Store pass #2 as oracle/fixtures/<scenario>.json.
      Record RNG draw count per checkpoint in every snapshot.
    depends_on: [oracle-01, oracle-02]
    status: verified
    session: 2026-09-28-02
    verification:
      checks: "3 fixtures captured, each run twice -> IDENTICAL via tools/diff-snapshots.js: fresh-100-ticks (100t), gather-hut-field (900t, full early chain incl. kitten birth + job assign), first-research (3000t, seasons + library + scholars)"

  - id: oracle-04
    title: Port-side F# runner + snapshot diff tool
    layer: infra
    contract: >
      Console runner (tools or kittens_land sim host) executes a scenario against
      the F# core and emits the same snapshot JSON shape. tools/diff-snapshots.js
      compares two snapshots exactly (floats bit-identical), reports first
      divergence with tick + pointer context.
    depends_on: [oracle-02]
    status: in-progress
    session: 2026-09-28-02
    notes: "diff-snapshots.js done and proven on all self-checks; F# port-side runner waits for the F# core sim (first phase-3 units)"

  # ------------------------------------------------------------------- verify
  - id: verify-01
    title: Verify elmishKittens specs against orig; re-emit under analysis/specs/
    layer: data
    contract: >
      For each ../elmishKittens/specs/*.fs.md: write tools/verify-specs.js that
      re-extracts the same values from orig source (prices, ratios, effects,
      unlock rules) and diffs against the spec file. All diffs either fixed in the
      re-emitted spec or recorded as discrepancies. Output: analysis/specs/*.fs.md
      marked verified.
    status: not-started

